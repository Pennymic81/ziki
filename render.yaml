# Demo deployment of the pipeline cleanup feature (PR #699) on Render's free plan.
# Not production: password login is on and the demo data loads at start.
# The database is an external free Postgres (Neon): Render allows one free
# database per workspace. Paste its connection string as DATABASE_URL.

services:
  - type: web
    name: ziki-pipeline-demo
    runtime: docker
    region: virginia
    plan: free
    branch: demo/pipeline-cleanup-render
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: AUTH_URL
        value: https://ziki-pipeline-demo.onrender.com/api/auth
      - key: NEXTAUTH_URL
        value: https://ziki-pipeline-demo.onrender.com/api/auth
      - key: AUTH_PASSWORD_LOGIN
        value: "true"
      - key: DEMO_SEED
        value: "true"
      # Starts in dry_run so the demo tickets stay open; switch to "on" in the
      # Render dashboard during the demo and they close within a minute.
      - key: PIPELINE_CLEANUP
        value: dry_run
      - key: PORT
        value: "3000"
